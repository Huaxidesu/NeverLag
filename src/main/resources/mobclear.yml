# NeverLag 生物清理配置（1.4.0 起启用）
#
# 与 config.yml 的 ClearEntity 段互不影响：本文件 Enable 为 true 时，
# 旧的 ClearEntity 定时任务自动停用，避免同一批生物被清两次。
# 改完执行 /neverlag reload 即可生效，不必重启。

# 是否开启定时清理
Enable: true

# 清理间隔（秒）。到点就清，没有数量阈值。
# 1800 秒 = 半小时；想更勤快就调小，最小 5 秒。
Delay: 1800

# 清理前的倒计时提醒（秒）。
# 到点前在这些时间点各播一条纯文本，与垃圾清理插件同一套播报方式（broadcastMessage），
# 不受聊天组件影响，必定送达。留空写成 [] 则完全不提醒；数值要小于 Delay，否则忽略。
WarningAt:
  - 60
  - 10

# 提醒文案，%TIME% 会被替换成剩余秒数
WarningMessage: '&b[NeverLag] &a生物清理将在 &e%TIME% &a秒后开始，请及时离开刷怪场'

# 定时清理的类别。默认三类全清，只保留 Boss、命名牌生物、驯服宠物。
# 手动 /neverlag clear all 同样三类全清，不受这里的开关限制。
Clean:
  # 敌对：所有 IMob（含 Mod 生物）
  Hostile: true
  # 友好：动物、鱿鱼、蝙蝠、村民
  Friendly: true
  # 中立：铁傀儡、雪傀儡等既不是怪物也不是动物的 EntityCreature
  Neutral: true

# 每 tick 最多移除多少只（分批删除，避免一次卡死主线程）
# 上万只生物时可以调大，配合 TimeBudgetMs 一起看
BatchSize: 200

# 每 tick 最多占用多少毫秒
TimeBudgetMs: 4

# 额外归类，填 EntityList 的实体键（如 Thaumcraft.Wisp、TwilightForest.Hydra）
# 用于把某个 Mod 生物从默认类别里挪出来
ExtraHostile: []
ExtraFriendly: []
ExtraNeutral: []

# 永不清理的实体，默认不排除任何生物（村民、铁傀儡都会被清）。
# 想保住某类生物就往这里加键，例如：
#   - Villager            村民
#   - Thaumcraft.Golem    神秘傀儡（玩家自动化常用，默认不排除）
# 画、展示框、拴绳结、掉落物、经验球不属于生物，永远不会被这个功能碰到。
Exclude: []

# 额外保护名单。Boss 有三条自动判定（下面这个列表只是补充，不写也认）：
#   1. 实现 IBossDisplayData —— 1.7.10 的头顶血条只认这个接口，屏幕上方有血条的一定命中
#   2. 实现 IEntityMultiPart —— 末影龙、九头蛇、娜迦、混沌守卫这类多部位实体
#   3. 类名（含父类）里带 Boss —— 由 ProtectBossNamed 控制
# 这里写实体键（Thaumcraft.EldritchWarden）或类名（EntityEldritchWarden）都能命中。
# 下面这份名单是扫描整合包全部 229 个模组后整理出来的，按模组分组。
Boss:
  # 暮色森林：五个有血条的大 Boss + 三个无血条的小 Boss
  - EntityTFHydra
  - EntityTFUrGhast
  - EntityTFNaga
  - EntityTFLich
  - EntityTFSnowQueen
  - EntityTFMinoshroom
  - EntityTFKnightPhantom
  - EntityTFAlphaYeti
  # 神秘时代： eldritch 守卫/傀儡、邪术师首领与传送门、巨型腐化触手
  - EntityEldritchWarden
  - EntityEldritchGolem
  - EntityCultistLeader
  - EntityCultistPortal
  - EntityTaintacleGiant
  - EntityThaumcraftBoss
  # 植物魔法：盖亚守护者（I / II 都是这个类）
  - EntityDoppleganger
  # 龙之研究：混沌守卫（混沌龙）、自定义龙
  - EntityChaosGuardian
  - EntityCustomDragon
  # 星系：月球骷髅王、火星苦力怕王
  - EntitySkeletonBoss
  - EntityCreeperBoss
  # 星空（GalaxySpace）：烈焰王、水晶王、恶魂王、史莱姆王、狼王
  - EntityBlazeBoss
  - EntityCrystalBoss
  - EntityGhastBoss
  - EntitySlimeBoss
  - EntityWolfBoss
  # 末地扩展（HEE）：末影龙、末影恶魔、末影之眼、烈焰恶魔
  - EntityBossDragon
  - EntityBossEnderDemon
  - EntityMiniBossEnderEye
  - EntityMiniBossFireFiend
  # 匠魂：蓝色史莱姆王
  - KingBlueSlime
  # 巫术：芭芭雅嘎、死神、哥布林、鹿角猎手、伦纳德、莉莉丝、痛苦领主、倒影
  - EntityBabaYaga
  - EntityDeath
  - EntityGoblinGulg
  - EntityGoblinMog
  - EntityHornedHuntsman
  - EntityLeonard
  - EntityLilith
  - EntityLordOfTorment
  - EntityReflection
  # 阿蒙拉：木乃伊王
  - EntityMummyBoss
  # 未来科技（Et Futurum）：1.9 复活龙
  - EntityRespawnedDragon
  # 原版
  - EntityWither
  - EntityDragon

# 类名（含父类）里带 Boss 的一律当 Boss 保护。
# 关掉它只影响「名字里有 Boss 但没实现血条接口」的模组生物，上面名单与接口判定仍然生效。
ProtectBossNamed: true

# 清理完成后是否全服播报
Broadcast: true

# 调试：把发给客户端的简报 JSON 打进控制台（排查悬浮文字不显示时用）
Debug: false

# 敌对生物带名字是否也照清。默认 false：**任何**带名字的生物都保留。
# 注意 SpecialMobs 这类模组会给怪物自动起名（如「疾病缠身的 僵尸」），
# 开了这个才会把它们当普通怪清掉；但玩家用命名牌命名的僵尸也会一起被清，
# 所以默认关闭。确实想让自动起名的怪物被清，再改成 true。
ClearNamedHostile: false

# 播报文案，%COUNT% 会被替换成清理总数；支持 & 颜色代码
# 鼠标悬浮在播报上可看「中文名: 数量」明细
Message: '&b[NeverLag] &a本次清理了 &c%COUNT% &a只生物'

# 没吃的那部分，附在播报末尾，数量为 0 时不显示；置空字符串可关掉对应提示
NamedMessage: '&7（命名的 &f%NAMED% &7只太硬，卡牙，这次没吃）'
TamedMessage: '&7（&f%TAMED% &7只驯服宠物，下不去口）'
BossMessage: '&7（&f%BOSS% &7只 Boss，打不过）'
